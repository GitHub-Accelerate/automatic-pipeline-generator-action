jobs:
    main:
        if: needs.run-generator.outputs.workflow-updated == 'false'
        needs: run-generator
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                go-version: 1.25.3
            - name: Build
              run: |
                go build -v -o ../build/generator ./...
            - name: Test
              run: go test -v ./...
            - name: Package build folder
              run: |
                zip -r build.zip ../build
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                name: build-artifact
                path: build.zip
    run-generator:
        outputs:
            workflow-updated: ${{ steps.run-action.outputs.workflow-updated }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                persist-credentials: false
            - id: run-action
              name: Run pipeline-gen action
              uses: GitHub-Accelerate/automatic-pipeline-generator-action@main
              env:
                GH_WORKFLOW_WRITE: ${{ secrets.GH_WORKFLOW_WRITE }}
name: Pipeline generator
"on":
    - push
    - pull_request
permissions: write-all
