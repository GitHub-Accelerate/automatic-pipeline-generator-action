name: Push File

on: [pull_request]

env:
    sha: $GITHUB_SHA

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.2'

    - name: Build
      run: |
        go build -v -o ../build/generator ./...

    - name: Test
      run: go test -v ./...
