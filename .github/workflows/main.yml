name: Pipeline generator

on: [push, pull_request]

permissions: write-all

jobs:
  run-generator:
    runs-on: ubuntu-latest
    outputs:
      workflow-updated: ${{ steps.run-action.outputs.workflow-updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run pipeline-gen action
        id: run-action
        uses: GitHub-Accelerate/automatic-pipeline-generator-action@main

      - name: Commit and push if workflow changed
        if: steps.run-action.outputs.workflow-updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main.yml
          git commit -m "chore: update workflow"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  main:
    needs: run-generator
    if: needs.run-generator.outputs.workflow-updated == 'false'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.3'

    - name: Build
      run: |
        go build -v -o ../build/generator ./...

    - name: Test
      run: go test -v ./...

    - name: Package build folder
      run: |
        zip -r build.zip ../build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build.zip
