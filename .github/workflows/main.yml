name: Pipeline generator
on:
  - push
  - pull_request
permissions: write-all
jobs:
  run-generator:
    runs-on: ubuntu-latest
    outputs:
      workflow-updated: ${{ steps.run-action.outputs.workflow-updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run pipeline-gen action
        id: run-action
        uses: GitHub-Accelerate/automatic-pipeline-generator-action@main
        env:
          GH_WORKFLOW_WRITE: ${{ secrets.GH_WORKFLOW_WRITE }}
  main:
    runs-on: ubuntu-latest
    needs: run-generator
    if: needs.run-generator.outputs.workflow-updated == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
          scan-ref: .
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
      - name: Scan for secrets with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          scan-ref: .
          scan-type: fs
          scanners: secret
          severity: CRITICAL,HIGH
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
      - name: Build
        run: |
          mkdir ../build
          go build -v -o ../build ./...
      - name: Test
        run: go test -v ./...
      - name: Package build folder
        run: |
          zip -r build.zip ../build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
