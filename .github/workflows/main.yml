name: Default

on: [push, pull_request]


jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.3'

    - name: Build
      run: |
        go build -v -o ../build/generator ./...

    - name: Test
      run: go test -v ./...
