name: Default

on: [push, pull_request]

jobs:
  main:
    runs-on: ubuntu-latest
    needs: run-generator
    if: needs.run-generator.outputs.workflow-updated == 'false'
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.3'

    - name: Build
      run: |
        mkdir ../build
        go build -v -o ../build ./...

    - name: Test
      run: go test -v ./...

    - name: Package build folder
      run: |
        zip -r build.zip ../build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build.zip
